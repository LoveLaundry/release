name: security-and-verification

on:
  pull_request:
  push:
    branches: [main, master]

permissions:
  contents: read
  security-events: write

jobs:
  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  python-static-and-tests:
    name: Python SAST, dependency scan, tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [quotation-service, bill_service, laundry-management, user-service, worker-service, love-ai]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install service development dependencies
        working-directory: ${{ matrix.service }}
        run: python -m pip install --upgrade pip && pip install -r requirements-dev.txt
      - name: Run service tests
        working-directory: ${{ matrix.service }}
        run: python -m pytest -q
      - name: Bandit SAST
        working-directory: ${{ matrix.service }}
        run: python -m pip install bandit pip-audit && bandit -q -r src && pip-audit -r requirements.txt
      - name: Compile Python sources
        working-directory: ${{ matrix.service }}
        run: python -m compileall -q src

  javascript-security:
    name: JavaScript dependency and build checks
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [quotations-ui, guest-billing, public.lovelaundry.lk, lovelaundry-bot]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ${{ matrix.app }}/package-lock.json
      - working-directory: ${{ matrix.app }}
        run: npm ci
      - working-directory: ${{ matrix.app }}
        run: npm audit --audit-level=high
      - working-directory: ${{ matrix.app }}
        run: npm run lint --if-present
      - working-directory: ${{ matrix.app }}
        run: npm run build --if-present

  container-scan:
    name: Container and IaC scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: CRITICAL,HIGH
          ignore-unfixed: false
          exit-code: '1'
      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: cyclonedx-json
          artifact-name: lovelaundry-sbom.cdx.json
      - uses: actions/upload-artifact@v4
        with:
          name: lovelaundry-sbom
          path: lovelaundry-sbom.cdx.json

  dast:
    name: DAST against dedicated test deployment
    runs-on: ubuntu-latest
    if: ${{ vars.DAST_TARGET_URL != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: zaproxy/action-baseline@v0.14.0
        with:
          target: ${{ vars.DAST_TARGET_URL }}
          fail_action: true
          allow_issue_writing: false

  migration-verification:
    name: Migration and tenant safety checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - working-directory: .
        run: python -m pip install pymongo mongomock pytest
      - run: python -m py_compile deploy/migrations/001_multi_tenant_backfill.py
      - run: python -m pytest -q deploy/migrations/test_001_multi_tenant_backfill.py
      - run: python deploy/migrations/001_multi_tenant_backfill.py --help
