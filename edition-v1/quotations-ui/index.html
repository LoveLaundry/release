<!doctype html>
<html lang="en">
  <head>
    <script>(function(){try{var t=localStorage.getItem('lovelaundry-theme');if(t!=='light'&&t!=='dark'){var p=localStorage.getItem('theme-preset');t=(p==='dark'||p==='nightblue'||p==='contrast-dark')?'dark':'light'}var r=document.documentElement;r.setAttribute('data-theme',t);r.style.colorScheme=t;r.classList.toggle('dark',t==='dark');var preset=p||'light';if(t==='dark'||preset==='dark'||preset==='nightblue'||preset==='contrast-dark'){r.classList.add('dark-theme')}var size={xs:'12px',sm:'13px',md:'14px',lg:'15px',xl:'17px',xxl:'19px'}[localStorage.getItem('theme-font-size')||'md'];var zoom={xs:0.85,sm:0.92,md:1,lg:1.08,xl:1.18,xxl:1.3}[localStorage.getItem('theme-font-size')||'md'];r.style.setProperty('--body-font-size',size);r.style.setProperty('--body-font-zoom',String(zoom))}catch(e){document.documentElement.setAttribute('data-theme','light')}})();</script>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Love Laundry — Laundry pricing and quotation management." />
    <title>Love Laundry · Quotation Management</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
